<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>RMS — Возможные даты</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px 32px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    var(--tg-theme-bg-color, #ffffff);

  color:
    var(--tg-theme-text-color, #222222);
}


/* ---------- ГЛАВНЫЙ ЭКРАН ---------- */

.title {
  font-size: 27px;
  font-weight: 700;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 15px;
  line-height: 1.45;
  opacity: 0.65;
  margin-bottom: 24px;
}

.departments {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.department-button {
  width: 100%;

  border: none;
  border-radius: 16px;

  padding: 18px;

  text-align: left;

  font-size: 17px;
  font-weight: 600;

  background:
    var(--tg-theme-secondary-bg-color, #f2f2f2);

  color:
    var(--tg-theme-text-color, #222222);
}

.department-button:active {
  opacity: 0.7;
}


/* ---------- КАЛЕНДАРЬ ---------- */

.calendar-screen {
  display: none;
}

.back-button {
  border: none;
  background: transparent;

  padding: 0;
  margin-bottom: 20px;

  font-size: 15px;

  color:
    var(--tg-theme-link-color, #2481cc);
}

.section-title {
  font-size: 23px;
  font-weight: 700;
  margin-bottom: 20px;
}

.month {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 14px;
}

.calendar {
  background:
    var(--tg-theme-secondary-bg-color, #f4f4f5);

  border-radius: 18px;

  padding: 14px;
}

.weekdays,
.days {
  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 6px;
}

.weekday {
  text-align: center;

  font-size: 12px;

  opacity: 0.55;

  padding-bottom: 6px;
}

.day {
  aspect-ratio: 1;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  font-size: 16px;
}

.day.empty {
  visibility: hidden;
}

.day.active {
  background:
    var(--tg-theme-bg-color, #ffffff);

  font-weight: 700;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.1);

  cursor: pointer;
}

.day.free {
  background: #35b85a;
  color: #ffffff;
}

.day.busy {
  background: #e85d5d;
  color: #ffffff;
}

.day.maybe {
  background: #f2c94c;
  color: #222222;
}


/* ---------- ЛЕГЕНДА ---------- */

.legend {
  margin-top: 18px;

  display: flex;

  gap: 14px;

  flex-wrap: wrap;

  font-size: 13px;

  opacity: 0.75;
}

.legend-item {
  display: flex;

  align-items: center;

  gap: 6px;
}

.circle {
  width: 12px;
  height: 12px;

  border-radius: 50%;
}

.circle.free {
  background: #35b85a;
}

.circle.maybe {
  background: #f2c94c;
}

.circle.busy {
  background: #e85d5d;
}


/* ---------- ПОДСКАЗКА ---------- */

.hint {
  margin-top: 20px;

  font-size: 14px;

  line-height: 1.45;

  opacity: 0.65;
}


/* ---------- КНОПКА ОТПРАВИТЬ ---------- */

.send {
  width: 100%;

  border: none;

  border-radius: 14px;

  padding: 15px;

  margin-top: 24px;

  font-size: 17px;

  font-weight: 600;

  background:
    var(--tg-theme-button-color, #2481cc);

  color:
    var(--tg-theme-button-text-color, #ffffff);
}

.send:disabled {
  opacity: 0.6;
}


/* ---------- НИЖНЕЕ ОКНО ---------- */

.sheet-backdrop {
  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,0.28);

  z-index: 10;
}

.sheet {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  background:
    var(--tg-theme-bg-color, #ffffff);

  border-radius:
    22px 22px 0 0;

  padding:
    10px 16px 28px;

  z-index: 11;

  box-shadow:
    0 -4px 20px rgba(0,0,0,0.12);

  max-height: 80vh;

  overflow-y: auto;
}

.sheet-handle {
  width: 42px;
  height: 5px;

  border-radius: 5px;

  background:
    var(--tg-theme-hint-color, #aaaaaa);

  opacity: 0.45;

  margin:
    2px auto 18px;
}

.sheet-title {
  font-size: 20px;

  font-weight: 700;

  margin-bottom: 8px;
}

.sheet-subtitle {
  font-size: 14px;

  opacity: 0.6;

  margin-bottom: 14px;
}


/* ---------- КНОПКИ СТАТУСОВ ---------- */

.sheet-option {
  width: 100%;

  border: none;

  border-radius: 14px;

  padding: 15px;

  margin-top: 8px;

  text-align: left;

  font-size: 16px;

  font-weight: 600;

  background:
    var(--tg-theme-secondary-bg-color, #f2f2f5);

  color:
    var(--tg-theme-text-color, #222222);
}

.sheet-option:active {
  opacity: 0.7;
}

.sheet-option.free {
  border-left:
    5px solid #35b85a;
}

.sheet-option.maybe {
  border-left:
    5px solid #f2c94c;
}

.sheet-option.busy {
  border-left:
    5px solid #e85d5d;
}


/* ---------- КОНЦЕРТЫ ПРИ НЕСКОЛЬКИХ СОБЫТИЯХ ---------- */

.concert-card {
  width: 100%;

  border: none;

  border-radius: 15px;

  padding: 15px;

  margin-top: 9px;

  text-align: left;

  background:
    var(--tg-theme-secondary-bg-color, #f2f2f5);

  color:
    var(--tg-theme-text-color, #222222);
}

.concert-card:active {
  opacity: 0.7;
}

.concert-card.free {
  background:
    rgba(53,184,90,0.18);
}

.concert-card.maybe {
  background:
    rgba(242,201,76,0.25);
}

.concert-card.busy {
  background:
    rgba(232,93,93,0.18);
}

.concert-main {
  font-size: 16px;

  font-weight: 700;
}

.concert-meta {
  font-size: 14px;

  opacity: 0.7;

  margin-top: 5px;
}

.concert-status {
  font-size: 14px;

  margin-top: 8px;

  font-weight: 600;
}


/* ---------- ОТМЕНА ---------- */

.sheet-cancel {
  width: 100%;

  border: none;

  background: transparent;

  padding:
    14px 0 0;

  font-size: 15px;

  color:
    var(--tg-theme-link-color, #2481cc);
}


/* ---------- СЛУЖЕБНЫЕ СООБЩЕНИЯ ---------- */

.loading {
  text-align: center;

  padding: 30px 10px;

  opacity: 0.65;
}

.error {
  text-align: center;

  padding: 20px 10px;

  color: #d33;
}

</style>
</head>


<body>


<!-- ========================================================= -->
<!-- ЭКРАН ВЫБОРА НАПРАВЛЕНИЯ -->
<!-- ========================================================= -->

<div id="departmentScreen">

  <div class="title">
    📅 Возможные даты
  </div>

  <div class="subtitle">
    Выберите направление.
  </div>

  <div class="departments">

    <button
      class="department-button"
      onclick="openCalendar('classic')"
    >
      🎼 Классика
    </button>


    <button
      class="department-button"
      onclick="openCalendar('pop')"
    >
      🎧 Эстрада / неоклассика
    </button>

  </div>

</div>



<!-- ========================================================= -->
<!-- ЭКРАН КАЛЕНДАРЯ -->
<!-- ========================================================= -->

<div
  id="calendarScreen"
  class="calendar-screen"
>

  <button
    class="back-button"
    onclick="showDepartments()"
  >
    ◀️ Назад к отделам
  </button>


  <div
    id="sectionTitle"
    class="section-title"
  ></div>


  <div class="month">
    Сентябрь 2026
  </div>


  <div class="calendar">

    <div class="weekdays">

      <div class="weekday">Пн</div>
      <div class="weekday">Вт</div>
      <div class="weekday">Ср</div>
      <div class="weekday">Чт</div>
      <div class="weekday">Пт</div>
      <div class="weekday">Сб</div>
      <div class="weekday">Вс</div>

    </div>


    <div
      id="days"
      class="days"
    ></div>

  </div>


  <div class="legend">

    <div class="legend-item">
      <span class="circle free"></span>
      Могу выступить
    </div>

    <div class="legend-item">
      <span class="circle maybe"></span>
      Пока не знаю
    </div>

    <div class="legend-item">
      <span class="circle busy"></span>
      Не могу выступить
    </div>

  </div>


  <div class="hint">
    Нажмите на выделенную дату, чтобы указать свою доступность.
  </div>


  <button
    id="sendButton"
    class="send"
    onclick="sendAvailability()"
  >
    📤 Отправить
  </button>

</div>



<!-- ========================================================= -->
<!-- НИЖНЕЕ ОКНО -->
<!-- ========================================================= -->

<div
  id="sheetBackdrop"
  class="sheet-backdrop"
  onclick="closeSheet()"
></div>


<div
  id="sheet"
  class="sheet"
>

  <div class="sheet-handle"></div>


  <div
    id="sheetTitle"
    class="sheet-title"
  ></div>


  <div
    id="sheetSubtitle"
    class="sheet-subtitle"
  ></div>


  <div
    id="sheetContent"
  ></div>


  <button
    class="sheet-cancel"
    onclick="closeSheet()"
  >
    Отмена
  </button>

</div>



<script>


/* ========================================================= */
/* TELEGRAM */
/* ========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp;


if (tg) {

  tg.ready();

  tg.expand();

}


/* ========================================================= */
/* SUPABASE */
/* ========================================================= */

const SUPABASE_FUNCTION =
  "https://zfuzzkwzcvyimhssmrhb.supabase.co/functions/v1/artist-calendar";


/* ========================================================= */
/* НАЗВАНИЯ ОТДЕЛОВ */
/* ========================================================= */

const departmentLabels = {

  classic:
    "🎼 Классика",

  pop:
    "🎧 Эстрада / неоклассика"

};


/* ========================================================= */
/* ТЕКУЩЕЕ СОСТОЯНИЕ */
/* ========================================================= */

let currentDepartment = null;

let events = [];

let activeDate = null;

let activeEventId = null;


/*
  Здесь будут храниться ответы артиста.

  Например:

  {
    13: "green",
    14: "red"
  }

  где 13 и 14 — event_id.
*/

const availability = {};


/* ========================================================= */
/* ПОКАЗАТЬ ОТДЕЛЫ */
/* ========================================================= */

function showDepartments() {

  document
    .getElementById("departmentScreen")
    .style.display = "block";


  document
    .getElementById("calendarScreen")
    .style.display = "none";


  currentDepartment = null;

}


/* ========================================================= */
/* ОТКРЫТЬ КАЛЕНДАРЬ */
/* ========================================================= */

async function openCalendar(department) {

  currentDepartment =
    department;


  document
    .getElementById("departmentScreen")
    .style.display = "none";


  document
    .getElementById("calendarScreen")
    .style.display = "block";


  document
    .getElementById("sectionTitle")
    .textContent =
      departmentLabels[department];


  document
    .getElementById("days")
    .innerHTML =
      '<div class="loading" style="grid-column:1/-1">' +
      'Загружаем даты…' +
      '</div>';


  try {

    const response =
      await fetch(
        SUPABASE_FUNCTION +
        "?department=" +
        encodeURIComponent(department)
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Не удалось загрузить даты."
      );

    }


    events =
      Array.isArray(data.events)
        ? data.events
        : [];


    drawCalendar();


  } catch (error) {

    console.error(error);


    document
      .getElementById("days")
      .innerHTML =
        '<div class="error" style="grid-column:1/-1">' +
        'Не удалось загрузить даты.' +
        '</div>';

  }

}


/* ========================================================= */
/* НАРИСОВАТЬ КАЛЕНДАРЬ */
/* ========================================================= */

function drawCalendar() {

  const container =
    document.getElementById("days");


  container.innerHTML = "";


  const year = 2026;

  const month = 8;
  /*
    В JavaScript:
    январь = 0
    сентябрь = 8
  */


  const firstDay =
    new Date(
      year,
      month,
      1
    );


  let startDay =
    firstDay.getDay();


  if (startDay === 0) {

    startDay = 7;

  }


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  /* Пустые клетки перед 1 сентября */

  for (
    let i = 1;
    i < startDay;
    i++
  ) {

    const empty =
      document.createElement("div");


    empty.className =
      "day empty";


    container.appendChild(
      empty
    );

  }


  /* Дни месяца */

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const date =
      year +
      "-" +
      String(month + 1).padStart(2, "0") +
      "-" +
      String(day).padStart(2, "0");


    const dayEvents =
      events.filter(
        event =>
          event.date === date
      );


    const element =
      document.createElement("div");


    element.className =
      "day";


    element.textContent =
      day;


    /*
      Если в этот день есть концерт,
      делаем дату активной.
    */

    if (dayEvents.length > 0) {

      element.classList.add(
        "active"
      );


      /*
        Если концерт только один,
        цвет показываем прямо
        на календаре.
      */

      if (dayEvents.length === 1) {

        const status =
          availability[
            dayEvents[0].id
          ];


        if (status === "green") {

          element.classList.add(
            "free"
          );

        }


        if (status === "yellow") {

          element.classList.add(
            "maybe"
          );

        }


        if (status === "red") {

          element.classList.add(
            "busy"
          );

        }

      }


      /*
        Если концертов несколько,
        дату оставляем нейтральной.

        При нажатии откроется
        список концертов.
      */

      element.onclick =
        () => openSheet(date);

    }


    container.appendChild(
      element
    );

  }

}


/* ========================================================= */
/* ОТКРЫТЬ НИЖНЕЕ ОКНО */
/* ========================================================= */

function openSheet(date) {

  activeDate =
    date;


  const dayEvents =
    events.filter(
      event =>
        event.date === date
    );


  document
    .getElementById("sheetTitle")
    .textContent =
      formatDate(date);


  document
    .getElementById("sheetBackdrop")
    .style.display =
      "block";


  document
    .getElementById("sheet")
    .style.display =
      "block";


  /*
    Один концерт.
    Сразу показываем статусы.
  */

  if (dayEvents.length === 1) {

    activeEventId =
      dayEvents[0].id;


    const event =
      dayEvents[0];


    document
      .getElementById("sheetSubtitle")
      .textContent =
        formatEventInfo(event);


    showStatusButtons();

    return;

  }


  /*
    Несколько концертов.
    Сначала показываем выбор концерта.
  */

  activeEventId =
    null;


  document
    .getElementById("sheetSubtitle")
    .textContent =
      "В этот день несколько концертов. Выберите нужный:";


  const content =
    document.getElementById(
      "sheetContent"
    );


  content.innerHTML = "";


  dayEvents.forEach(
    event => {

      const button =
        document.createElement("button");


      button.className =
        "concert-card";


      const status =
        availability[event.id];


      if (status === "green") {

        button.classList.add(
          "free"
        );

      }


      if (status === "yellow") {

        button.classList.add(
          "maybe"
        );

      }


      if (status === "red") {

        button.classList.add(
          "busy"
        );

      }


      let statusText =
        "";


      if (status === "green") {

        statusText =
          "🟢 Могу выступить";

      }


      if (status === "yellow") {

        statusText =
          "🟡 Пока не знаю";

      }


      if (status === "red") {

        statusText =
          "🔴 Не могу выступить";

      }


      button.innerHTML =

        '<div class="concert-main">' +

        (
          event.city ||
          "Санкт-Петербург"
        ) +

        '</div>' +

        '<div class="concert-meta">' +

        (
          event.time ||
          "Время не указано"
        ) +

        '</div>' +

        (
          statusText
            ? '<div class="concert-status">' +
              statusText +
              '</div>'
            : ''
        );


      button.onclick =
        () => {

          activeEventId =
            event.id;


          document
            .getElementById("sheetSubtitle")
            .textContent =
              formatEventInfo(event);


          showStatusButtons();

        };


      content.appendChild(
        button
      );

    }
  );

}


/* ========================================================= */
/* ИНФОРМАЦИЯ О КОНЦЕРТЕ */
/* ========================================================= */

function formatEventInfo(event) {

  const city =
    event.city ||
    "Санкт-Петербург";


  const time =
    event.time ||
    "Время не указано";


  return (
    city +
    " · " +
    time
  );

}


/* ========================================================= */
/* ФОРМАТ ДАТЫ */
/* ========================================================= */

function formatDate(date) {

  return (
    date.slice(8, 10) +
    "." +
    date.slice(5, 7) +
    "." +
    date.slice(0, 4)
  );

}


/* ========================================================= */
/* ПОКАЗАТЬ КНОПКИ СТАТУСОВ */
/* ========================================================= */

function showStatusButtons() {

  const content =
    document.getElementById(
      "sheetContent"
    );


  content.innerHTML = `

    <button
      class="sheet-option free"
      onclick="chooseStatus('green')"
    >
      🟢 Могу выступить
    </button>


    <button
      class="sheet-option maybe"
      onclick="chooseStatus('yellow')"
    >
      🟡 Пока не знаю
    </button>


    <button
      class="sheet-option busy"
      onclick="chooseStatus('red')"
    >
      🔴 Не могу выступить
    </button>

  `;

}


/* ========================================================= */
/* ВЫБОР СТАТУСА */
/* ========================================================= */

function chooseStatus(status) {

  if (!activeEventId) {

    return;

  }


  availability[
    activeEventId
  ] =
    status;


  drawCalendar();


  closeSheet();

}


/* ========================================================= */
/* ЗАКРЫТЬ НИЖНЕЕ ОКНО */
/* ========================================================= */

function closeSheet() {

  document
    .getElementById("sheetBackdrop")
    .style.display =
      "none";


  document
    .getElementById("sheet")
    .style.display =
      "none";


  activeDate =
    null;


  activeEventId =
    null;

}


/* ========================================================= */
/* ОТПРАВКА В SUPABASE */
/* ========================================================= */

async function sendAvailability() {

  /*
    Проверяем, выбрал ли артист
    хотя бы один концерт.
  */

  if (
    Object.keys(
      availability
    ).length === 0
  ) {

    if (tg) {

      tg.showAlert(
        "Сначала укажите доступность хотя бы для одной даты."
      );

    } else {

      alert(
        "Сначала укажите доступность хотя бы для одной даты."
      );

    }

    return;

  }


  /*
    Получаем initData именно
    от Telegram.

    Именно это позволяет серверу
    понять, какой артист отправляет
    данные.
  */

  const initData =
    tg
      ? tg.initData
      : "";


  /*
    Если сайт открыт просто
    в Safari, Telegram данных нет.
  */

  if (!initData) {

    const message =
      "Откройте календарь через Telegram.";


    if (tg) {

      tg.showAlert(
        message
      );

    } else {

      alert(
        message
      );

    }

    return;

  }


  /*
    Превращаем объект:

    {
      13: "green",
      14: "red"
    }

    в массив:

    [
      {
        event_id: 13,
        status: "green"
      },
      {
        event_id: 14,
        status: "red"
      }
    ]
  */

  const availabilityArray =
    Object.entries(
      availability
    ).map(
      ([event_id, status]) => ({

        event_id:
          Number(event_id),

        status:
          status

      })
    );


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  sendButton.disabled =
    true;


  sendButton.textContent =
    "⏳ Отправляем…";


  try {

    const response =
      await fetch(
        SUPABASE_FUNCTION,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              initData:
                initData,

              availability:
                availabilityArray

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Не удалось сохранить данные."
      );

    }


    console.log(
      "Сохранено:",
      data
    );


    /*
      Всё получилось.
    */

    sendButton.textContent =
      "✅ Отправлено";


    if (tg) {

      tg.showAlert(
        "Спасибо! Ваши даты отправлены в RMS. ❤️"
      );

    } else {

      alert(
        "Спасибо! Ваши даты отправлены в RMS. ❤️"
      );

    }


  } catch (error) {

    console.error(
      error
    );


    if (tg) {

      tg.showAlert(
        "Не удалось отправить данные: " +
        error.message
      );

    } else {

      alert(
        "Не удалось отправить данные: " +
        error.message
      );

    }


    sendButton.disabled =
      false;


    sendButton.textContent =
      "📤 Отправить";

  }

}

</script>
