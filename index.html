<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>Возможные даты</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #222222;
    }

    .title {
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.45;
      opacity: 0.65;
      margin-bottom: 24px;
    }

    .departments {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .department-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 18px;
      text-align: left;
      font-size: 17px;
      font-weight: 600;
      background: #f2f2f4;
      color: #222;
      cursor: pointer;
    }

    .department-button:active {
      transform: scale(0.99);
    }

    .back-button {
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 28px;
      color: #2481cc;
      font-size: 17px;
      cursor: pointer;
    }

    .calendar-title {
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .calendar {
      background: #f5f5f7;
      border-radius: 28px;
      padding: 20px 12px 22px;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .weekday {
      text-align: center;
      color: #8a8a8f;
      font-size: 15px;
      padding-bottom: 12px;
    }

    .day {
      min-height: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      padding-top: 7px;
    }

    .day-number {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 19px;
      font-weight: 500;
    }

    .day.available .day-number {
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .day.available.selected-green .day-number {
      background: #34c759;
      color: white;
      font-weight: 700;
    }

    .day.available.selected-yellow .day-number {
      background: #ffd60a;
      color: #222;
      font-weight: 700;
    }

    .day.available.selected-red .day-number {
      background: #ff6b6b;
      color: white;
      font-weight: 700;
    }

    .day-time {
      margin-top: 5px;
      font-size: 14px;
      color: #777;
      line-height: 1.15;
      text-align: center;
    }

    .day-city {
      margin-top: 3px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }

    .legend {
      margin-top: 28px;
      font-size: 16px;
      line-height: 1.7;
      color: #666;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex: 0 0 20px;
    }

    .green {
      background: #34c759;
    }

    .yellow {
      background: #ffd60a;
    }

    .red {
      background: #ff6b6b;
    }

    .instruction {
      margin-top: 24px;
      font-size: 16px;
      line-height: 1.5;
      color: #777;
    }

    .send-button {
      width: 100%;
      margin-top: 28px;
      padding: 20px;
      border: none;
      border-radius: 24px;
      background: #2481cc;
      color: white;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:active {
      transform: scale(0.99);
    }

    .hidden {
      display: none;
    }

    .loading {
      font-size: 17px;
      color: #777;
      padding: 20px 0;
    }

    .error {
      color: #d93025;
      font-size: 16px;
      line-height: 1.5;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <!-- ВЫБОР ОТДЕЛА -->
  <section id="departmentScreen">
    <div class="title">📅 Возможные даты</div>

    <div class="subtitle">
      Выберите направление.
    </div>

    <div class="departments">
      <button
        class="department-button"
        onclick="openDepartment('classic')"
      >
        🎼 Классика
      </button>

      <button
        class="department-button"
        onclick="openDepartment('pop')"
      >
        🎧 Эстрада / неоклассика
      </button>
    </div>
  </section>


  <!-- КАЛЕНДАРЬ -->
  <section id="calendarScreen" class="hidden">

    <button class="back-button" onclick="backToDepartments()">
      ◀️ Назад к отделам
    </button>

    <div class="title" id="departmentTitle"></div>

    <div class="calendar-title">
      Сентябрь 2026
    </div>

    <div id="loading" class="loading">
      Загружаем даты…
    </div>

    <div id="calendarContent" class="hidden">

      <div class="calendar">

        <div class="weekdays">
          <div class="weekday">Пн</div>
          <div class="weekday">Вт</div>
          <div class="weekday">Ср</div>
          <div class="weekday">Чт</div>
          <div class="weekday">Пт</div>
          <div class="weekday">Сб</div>
          <div class="weekday">Вс</div>
        </div>

        <div id="days" class="days"></div>

      </div>

      <div class="legend">

        <div class="legend-row">
          <span class="legend-dot green"></span>
          <span>Могу выступить</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot yellow"></span>
          <span>Пока не знаю</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot red"></span>
          <span>Не могу выступить</span>
        </div>

      </div>

      <div class="instruction">
        Нажмите на дату и выберите один вариант:
      </div>

      <button class="send-button" onclick="sendAvailability()">
        📤 Отправить
      </button>

    </div>

    <div id="error" class="error hidden"></div>

  </section>


  <script>

    const API_URL =
      "https://zfuzzkwzcvyimhssmrhb.supabase.co/functions/v1/artist-calendar";

    let currentDepartment = null;
    let events = [];
    let selectedDates = {};


    async function openDepartment(department) {

      currentDepartment = department;

      document
        .getElementById("departmentScreen")
        .classList.add("hidden");

      document
        .getElementById("calendarScreen")
        .classList.remove("hidden");

      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("calendarContent").classList.add("hidden");
      document.getElementById("error").classList.add("hidden");

      document.getElementById("departmentTitle").textContent =
        department === "classic"
          ? "🎼 Классика"
          : "🎧 Эстрада / неоклассика";

      selectedDates = {};

      try {

        const response = await fetch(
          API_URL + "?department=" + encodeURIComponent(department)
        );

        if (!response.ok) {
          throw new Error("Ошибка загрузки");
        }

        const data = await response.json();

        events = data.events || [];

        renderCalendar();

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("calendarContent").classList.remove("hidden");

      } catch (error) {

        document.getElementById("loading").classList.add("hidden");

        const errorBlock = document.getElementById("error");

        errorBlock.textContent =
          "Не удалось загрузить даты. Попробуйте ещё раз.";

        errorBlock.classList.remove("hidden");
      }
    }


    function backToDepartments() {

      document
        .getElementById("calendarScreen")
        .classList.add("hidden");

      document
        .getElementById("departmentScreen")
        .classList.remove("hidden");

      selectedDates = {};
    }


    function renderCalendar() {

      const daysContainer = document.getElementById("days");

      daysContainer.innerHTML = "";

      /*
        1 сентября 2026 года — вторник.
        Поэтому перед единицей ставим один пустой день.
      */

      daysContainer.appendChild(createEmptyDay());


      for (let day = 1; day <= 30; day++) {

        const dateString =
          "2026-09-" + String(day).padStart(2, "0");

        const event = events.find(
          item => item.date === dateString
        );

        const dayElement = document.createElement("div");

        dayElement.className = "day";

        const numberElement =
          document.createElement("div");

        numberElement.className = "day-number";

        numberElement.textContent = day;

        dayElement.appendChild(numberElement);


        if (event) {

          dayElement.classList.add("available");

          numberElement.addEventListener(
            "click",
            () => chooseDate(dateString)
          );


          const timeElement =
            document.createElement("div");

          timeElement.className = "day-time";

          timeElement.textContent =
            formatTime(event.time);

          dayElement.appendChild(timeElement);


          /*
            Москва показывается только тогда,
            когда city действительно указан в базе.
          */

          if (event.city) {

            const cityElement =
              document.createElement("div");

            cityElement.className = "day-city";

            cityElement.textContent =
              event.city;

            dayElement.appendChild(cityElement);
          }


          applySelectedState(
            dayElement,
            dateString
          );
        }

        daysContainer.appendChild(dayElement);
      }
    }


    function createEmptyDay() {

      const empty = document.createElement("div");

      empty.className = "day";

      return empty;
    }


    function formatTime(time) {

      if (!time) return "";

      return String(time).slice(0, 5);
    }


    function chooseDate(date) {

      /*
        Цикл:
        первое нажатие → могу выступить
        второе → пока не знаю
        третье → не могу выступить
        четвёртое → снова без отметки
      */

      const current =
        selectedDates[date] || null;

      if (!current) {
        selectedDates[date] = "green";
      } else if (current === "green") {
        selectedDates[date] = "yellow";
      } else if (current === "yellow") {
        selectedDates[date] = "red";
      } else {
        delete selectedDates[date];
      }

      renderCalendar();
    }


    function applySelectedState(
      element,
      date
    ) {

      const state = selectedDates[date];

      if (state === "green") {
        element.classList.add("selected-green");
      }

      if (state === "yellow") {
        element.classList.add("selected-yellow");
      }

      if (state === "red") {
        element.classList.add("selected-red");
      }
    }


    function sendAvailability() {

      const selected = Object.entries(selectedDates);

      if (selected.length === 0) {

        alert(
          "Выберите хотя бы одну дату."
        );

        return;
      }


      const result = selected.map(
        ([date, status]) => {

          let text = "";

          if (status === "green") {
            text = "Могу выступить";
          }

          if (status === "yellow") {
            text = "Пока не знаю";
          }

          if (status === "red") {
            text = "Не могу выступить";
          }

          return date + ": " + text;
        }
      );


      /*
        Пока только тестируем интерфейс.
        На следующем этапе подключим отправку
        непосредственно в таблицу availability.
      */

      alert(
        "Готово!\n\n" +
        result.join("\n")
      );
    }

  </script>

</body>
</html>
